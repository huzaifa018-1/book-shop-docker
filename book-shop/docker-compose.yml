version: "3.9"

services:
  db:
    image: postgres:15
    container_name: book-shop-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - book-shop-network
    restart: always

  backend:
    build: .
    container_name: book-shop-backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    depends_on:
      - db
    networks:
      - book-shop-network
    restart: always

  nginx:
    image: nginx:alpine
    container_name: book-shop-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - book-shop-network
    restart: always

volumes:
  postgres_data:

networks:
  book-shop-network:
    driver: bridge
