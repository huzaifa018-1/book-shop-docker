name: Dev Pipeline (Artifact-First)

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Create artifact
        run: |
          mkdir -p book-shop/artifacts
          tar -czf book-shop/artifacts/app-${{ github.sha }}.tar.gz \
            --exclude=.git \
            --exclude=__pycache__ \
            --exclude='*.pyc' \
            --exclude=.env \
            --exclude=artifacts \
            -C book-shop .

      - name: Commit artifact to repo
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Add artifact for commit ${{ github.sha }}"
          file_pattern: "book-shop/artifacts/"

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build Docker image from artifact
        run: |
          cd book-shop
          docker build \
            --build-arg ARTIFACT_FILE=app-${{ github.sha }}.tar.gz \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/book-shop:${{ github.sha }} .

      - name: Push to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/book-shop:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/book-shop-dev
            docker-compose -p dev down
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/book-shop:${{ github.sha }}
            sed -i "s|image:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/book-shop:${{ github.sha }}|" docker-compose.yml
            docker-compose -p dev up -d
