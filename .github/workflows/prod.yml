name: Prod Pipeline (Promotion Only)

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/book-shop-prod
            docker-compose -p prod down
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/book-shop:${{ vars.IMAGE_VERSION }}
            sed -i "s|image:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/book-shop:${{ vars.IMAGE_VERSION }}|" docker-compose.yml
            docker-compose -p prod up -d
